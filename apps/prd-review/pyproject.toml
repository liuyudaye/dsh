[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-prd-review"
version = "0.1.0"
description = "PRD review tools and report workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.5,<5",
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "python-dotenv==1.2.4",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
prd-review = "prd_review.__main__:main"
prd-review-agent = "prd_review.agent.launcher:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
prd_review = [
    "agent/skills/prd-review/SKILL.md",
    "web/static/*",
    "web/templates/*.html",
]
